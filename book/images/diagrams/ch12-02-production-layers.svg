<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Production evidence layers</title>
  <desc id="desc">Six offset evidence layers with different holes cover runtime guards, asynchronous graders, samples, risk review, delayed outcomes, and experiments.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <rect x="90" y="90" width="770" height="100" rx="8" fill="#F5E9E1" stroke="#A85F32" stroke-width="3" opacity="0.96"/><text x="130" y="148" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="130" dy="0">Runtime guard</tspan></text><circle cx="490" cy="140" r="25" fill="#FCFAF6" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 5"/><rect x="175" y="170" width="770" height="100" rx="8" fill="#E9EEF3" stroke="#17324D" stroke-width="3" opacity="0.96"/><text x="215" y="228" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="215" dy="0">Async grader</tspan></text><circle cx="692" cy="220" r="25" fill="#FCFAF6" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 5"/><rect x="260" y="250" width="770" height="100" rx="8" fill="#F8F0D8" stroke="#C6922A" stroke-width="3" opacity="0.96"/><text x="300" y="308" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="300" dy="0">Representative sample</tspan></text><circle cx="894" cy="300" r="25" fill="#FCFAF6" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 5"/><rect x="345" y="330" width="770" height="100" rx="8" fill="#F5E9E1" stroke="#A85F32" stroke-width="3" opacity="0.96"/><text x="385" y="388" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="385" dy="0">Risk review</tspan></text><circle cx="836" cy="380" r="25" fill="#FCFAF6" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 5"/><rect x="430" y="410" width="770" height="100" rx="8" fill="#E9EEF3" stroke="#17324D" stroke-width="3" opacity="0.96"/><text x="470" y="468" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="470" dy="0">Delayed outcome</tspan></text><circle cx="1038" cy="460" r="25" fill="#FCFAF6" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 5"/><rect x="515" y="490" width="770" height="100" rx="8" fill="#F8F0D8" stroke="#C6922A" stroke-width="3" opacity="0.96"/><text x="555" y="548" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="555" dy="0">Controlled experiment</tspan></text><circle cx="980" cy="540" r="25" fill="#FCFAF6" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 5"/><path d="M 1050 120 L 1050 650" fill="none" stroke="#A85F32" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-copper)"/><text x="1090" y="120" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="1090" dy="0">risk</tspan></text><text x="1090" y="650" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="1090" dy="0">caught</tspan></text><text x="600" y="735" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="600" dy="0">No single layer covers the whole system</tspan></text>
</svg>
