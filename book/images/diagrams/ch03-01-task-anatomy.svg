fill="#17324D"><tspan x="885" dy="0">Expected</tspan><tspan x="885" dy="30.5">evidence</tspan></text><line x1="965" y1="230" x2="992" y2="230" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="995" y="170" width="160" height="120" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="1075" y="223.5" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="650" font-style="normal" fill="#17324D"><tspan x="1075" dy="0">Metadata</tspan><tspan x="1075" dy="30.5">+ owner</tspan></text><path d="M 225 330 L 225 380 L 965 380 L 965 330" fill="none" stroke="#C6922A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="595" y="420" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" font-style="normal" fill="#C6922A"><tspan x="595" dy="0">HARNESS</tspan></text><text x="600" y="100" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" font-style="normal" fill="#17324D"><tspan x="600" dy="0">TASK CONTRACT</tspan></text><circle cx="110" cy="565" r="52" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="110" y="574" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#17324D"><tspan x="110" dy="0">Policy</tspan></text><line x1="110" y1="513" x2="110" y2="455" stroke="#17324D" stroke-width="3" stroke-dasharray="8 8"/><circle cx="300" cy="565" r="52" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="300" y="574" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#17324D"><tspan x="300" dy="0">Tools</tspan></text><line x1="300" y1="513" x2="300" y2="455" stroke="#17324D" stroke-width="3" stroke-dasharray="8 8"/><circle cx="490" cy="565" r="52" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="490" y="574" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#17324D"><tspan x="490" dy="0">Model</tspan></text><line x1="490" y1="513" x2="490" y2="455" stroke="#17324D" stroke-width="3" stroke-dasharray="8 8"/><circle cx="680" cy="565" r="52" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="680" y="574" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#17324D"><tspan x="680" dy="0">Grader</tspan></text><line x1="680" y1="513" x2="680" y2="455" stroke="#17324D" stroke-width="3" stroke-dasharray="8 8"/><circle cx="870" cy="565" r="52" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="870" y="574" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#17324D"><tspan x="870" dy="0">Environment</tspan></text><line x1="870" y1="513" x2="870" y2="455" stroke="#17324D" stroke-width="3" stroke-dasharray="8 8"/><circle cx="1060" cy="565" r="52" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="1060" y="574" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#17324D"><tspan x="1060" dy="0">Data version</tspan></text><line x1="1060" y1="513" x2="1060" y2="455" stroke="#17324D" stroke-width="3" stroke-dasharray="8 8"/><text x="600" y="680" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="600" dy="0">Version these dependencies with the task</tspan></text>
</svg>
