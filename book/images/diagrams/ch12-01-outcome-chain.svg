<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Offline-to-online outcome chain</title>
  <desc id="desc">Offline criterion flows through near-term behavior to product outcome, with each arrow labeled hypothesis and a production experiment feeding evidence back.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <rect x="55" y="210" width="300" height="160" rx="16" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="205" y="271.7" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="650" font-style="normal" fill="#17324D"><tspan x="205" dy="0">OFFLINE</tspan><tspan x="205" dy="36.6">CRITERION</tspan></text><text x="205" y="342" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="205" dy="0">measured in suite</tspan></text><rect x="450" y="210" width="300" height="160" rx="16" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="600" y="271.7" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="650" font-style="normal" fill="#17324D"><tspan x="600" dy="0">NEAR-TERM</tspan><tspan x="600" dy="36.6">BEHAVIOR</tspan></text><text x="600" y="342" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="600" dy="0">observed in use</tspan></text><rect x="845" y="210" width="300" height="160" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="995" y="271.7" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="650" font-style="normal" fill="#17324D"><tspan x="995" dy="0">PRODUCT</tspan><tspan x="995" dy="36.6">OUTCOME</tspan></text><text x="995" y="342" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="995" dy="0">what matters</tspan></text><line x1="355" y1="290" x2="450" y2="290" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="750" y1="290" x2="845" y2="290" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><text x="402" y="260" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="402" dy="0">hypothesis</tspan></text><text x="797" y="260" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="797" dy="0">hypothesis</tspan></text><rect x="450" y="500" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#A85F32" stroke-width="3"/><text x="600" y="555" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="650" font-style="normal" fill="#17324D"><tspan x="600" dy="0">PRODUCTION EXPERIMENT</tspan></text><text x="600" y="582" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="600" dy="0">validate the chain</tspan></text><path d="M 995 370 C 1000 550, 805 555, 750 555" fill="none" stroke="#A85F32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-copper)"/><path d="M 450 555 C 250 555, 210 430, 210 370" fill="none" stroke="#A85F32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-copper)"/><text x="600" y="690" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="600" dy="0">Evidence returns to the proxy definition</tspan></text>
</svg>
