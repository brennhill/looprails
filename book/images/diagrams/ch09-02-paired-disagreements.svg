<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Paired comparison</title>
  <desc id="desc">One hundred paired tasks divide into 62 both pass, 18 new-only, 8 old-only, and 12 both fail, emphasizing the 26 disagreements.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <rect x="45" y="120" width="600" height="250" rx="18" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="345" y="200" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" font-style="normal" fill="#C6922A"><tspan x="345" dy="0">62</tspan></text><text x="345" y="250" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" font-style="normal" fill="#17324D"><tspan x="345" dy="0">both pass</tspan></text><rect x="675" y="120" width="220" height="250" rx="18" fill="#E9EEF3" stroke="#17324D" stroke-width="6"/><text x="785" y="200" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" font-style="normal" fill="#17324D"><tspan x="785" dy="0">18</tspan></text><text x="785" y="250" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" font-style="normal" fill="#17324D"><tspan x="785" dy="0">new only</tspan></text><rect x="925" y="120" width="220" height="250" rx="18" fill="#F5E9E1" stroke="#A85F32" stroke-width="6"/><text x="1035" y="200" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" font-style="normal" fill="#A85F32"><tspan x="1035" dy="0">8</tspan></text><text x="1035" y="250" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" font-style="normal" fill="#17324D"><tspan x="1035" dy="0">old only</tspan></text><rect x="45" y="420" width="1100" height="180" rx="18" fill="#FFFFFF" stroke="#6B7280" stroke-width="3"/><text x="595" y="500" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" font-style="normal" fill="#6B7280"><tspan x="595" dy="0">12</tspan></text><text x="595" y="550" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" font-style="normal" fill="#17324D"><tspan x="595" dy="0">both fail</tspan></text><path d="M 785 390 L 1035 390" fill="none" stroke="#A85F32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="910" y="415" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="750" font-style="normal" fill="#A85F32"><tspan x="910" dy="0">26 discordant cases</tspan></text><text x="600" y="690" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="29" font-weight="800" font-style="normal" fill="#17324D"><tspan x="600" dy="0">New score − old score = +10 points</tspan></text>
</svg>
