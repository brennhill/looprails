<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">The first thirty days</title>
  <desc id="desc">Four weekly columns cover discover, encode, measure, and operate, ending in controlled shadow or production evidence with artifacts accumulating across the month.</desc>
