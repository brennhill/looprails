 text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="457" dy="0">WEEK 2</tspan></text><text x="457" y="180" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#17324D"><tspan x="457" dy="0">ENCODE</tspan></text><path d="M 372 234 L 383 245 L 372 256 L 361 245 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="400" y="253" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#17324D"><tspan x="400" dy="0">Task contracts</tspan></text><path d="M 372 309 L 383 320 L 372 331 L 361 320 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="400" y="328" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#17324D"><tspan x="400" dy="0">Grader map</tspan></text><path d="M 372 384 L 383 395 L 372 406 L 361 395 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="400" y="403" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#17324D"><tspan x="400" dy="0">Hard checks</tspan></text><path d="M 372 459 L 383 470 L 372 481 L 361 470 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="400" y="478" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#17324D"><tspan x="400" dy="0">Rubric</tspan></text><line x1="585" y1="335" x2="612" y2="335" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="615" y="85" width="255" height="500" rx="10" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="742" y="130" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="60