0" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#A85F32"><tspan x="1027" dy="0">OPERATE</tspan></text><path d="M 942 234 L 953 245 L 942 256 L 931 245 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="970" y="253" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#17324D"><tspan x="970" dy="0">CI + nightly</tspan></text><path d="M 942 309 L 953 320 L 942 331 L 931 320 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="970" y="328" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#17324D"><tspan x="970" dy="0">Held-out audit</tspan></text><path d="M 942 384 L 953 395 L 942 406 L 931 395 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="970" y="403" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#17324D"><tspan x="970" dy="0">Shadow / rollout</tspan></text><path d="M 942 459 L 953 470 L 942 481 L 931 470 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="970" y="478" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#17324D"><tspan x="970" dy="0">Owners</tspan></text><path d="M 75 640 L 1125 640" fill="none" stroke="#C6922A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M 220 620 L 240 640 L 220 660 L 200 640 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="220" y="700" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="220" dy="0">cases</tspan></text><path d="M 505 620 L 525 640 L 505 660 L 485 640 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="505" y="700" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="505" dy="0">graders</tspan></text><path d="M 790 620 L 810 640 L 790 660 L 770 640 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="790" y="700" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="790" dy="0">decision</tspan></text><path d="M 1075 620 L 1095 640 L 1075 660 L 1055 640 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="1075" y="700" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="1075" dy="0">cadence</tspan></text><text x="600" y="745" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="600" dy="0">Artifacts accumulate; the loop stays closed</tspan></text>
