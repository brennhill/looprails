<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Discovery sample versus measurement sample</title>
  <desc id="desc">Production feeds a failure-enriched discovery basket and a probability-sampled measurement basket with different questions.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <rect x="440" y="55" width="320" height="100" rx="16" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="600" y="115.15" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="29" font-weight="650" font-style="normal" fill="#17324D"><tspan x="600" dy="0">PRODUCTION</tspan></text><line x1="520" y1="155" x2="310" y2="275" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="680" y1="155" x2="890" y2="275" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="80" y="275" width="450" height="320" rx="18" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="305" y="325" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" font-style="normal" fill="#A85F32"><tspan x="305" dy="0">DISCOVERY SAMPLE</tspan></text><text x="305" y="375" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="305" dy="0">failure-enriched</tspan></text><circle cx="180" cy="455" r="34" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><circle cx="260" cy="440" r="34" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><circle cx="335" cy="470" r="34" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><circle cx="415" cy="430" r="34" fill="#FFFFFF" stroke="#A85F32" stroke-width="3"/><text x="305" y="550" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="29" font-weight="600" font-style="normal" fill="#17324D"><tspan x="305" dy="0">What can fail?</tspan></text><rect x="670" y="275" width="450" height="320" rx="18" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="895" y="325" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" font-style="normal" fill="#17324D"><tspan x="895" dy="0">MEASUREMENT SAMPLE</tspan></text><text x="895" y="375" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="895" dy="0">probability-sampled</tspan></text><circle cx="770" cy="455" r="34" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><circle cx="850" cy="440" r="34" fill="#FFFFFF" stroke="#C6922A" stroke-width="3"/><circle cx="925" cy="470" r="34" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><circle cx="1005" cy="430" r="34" fill="#FFFFFF" stroke="#C6922A" stroke-width="3"/><text x="895" y="550" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="29" font-weight="600" font-style="normal" fill="#17324D"><tspan x="895" dy="0">How often?</tspan></text><text x="600" y="690" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="600" dy="0">Different sampling frames answer different questions</tspan></text>
</svg>
