x="185" dy="0">Cost + latency</tspan></text><line x1="315" y1="590" x2="510" y2="590" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="510" y="115" width="300" height="445" rx="18" fill="#FFFFFF" stroke="#17324D" stroke-width="5"/><text x="660" y="165" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" font-style="normal" fill="#17324D"><tspan x="660" dy="0">STRUCTURED RESULT</tspan></text><rect x="565" y="220" width="190" height="90" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="660" y="273.75" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="650" font-style="normal" fill="#17324D"><tspan x="660" dy="0">eligible?</tspan></text><rect x="565" y="350" width="190" height="90" rx="16" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="660" y="403.4" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="650" font-style="normal" fill="#17324D"><tspan x="660" dy="0">quality vector</tspan></text><text x="660" y="500" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="660" dy="0">evidence + reasons</tspan></text><line x1="810" y1="335" x2="935" y2="335" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="935" y="245" width="210" height="180" rx="16" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="1040" y="335" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="650" font-style="normal" fill="#17324D"><tspan x="1040" dy="0">DECISION</tspan></text><text x="1040" y="397" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="1040" dy="0">no hidden averaging</tspan></text><path 