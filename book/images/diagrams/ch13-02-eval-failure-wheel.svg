8F0D8" stroke="#C6922A" stroke-width="5"/><text x="600" y="355" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" font-style="normal" fill="#17324D"><tspan x="600" dy="0">THE EVAL IS</tspan></text><text x="600" y="395" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#17324D"><tspan x="600" dy="0">PART OF THE SYSTEM</tspan></text>
