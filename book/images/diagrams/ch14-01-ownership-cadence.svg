<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Ownership map and clocks</title>
  <desc id="desc">Eval artifacts sit at the center of product, engineering, and domain owners, supported by platform, data science, and risk, with recurring review clocks.</desc>
