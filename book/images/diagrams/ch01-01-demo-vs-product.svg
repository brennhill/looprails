<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Demo question versus product questions</title>
  <desc id="desc">One spotlighted demo case asks whether the system can work once, while varied production cases ask about truth, repetition, safety, variation, and learning.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <rect x="50" y="90" width="350" height="560" rx="18" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="225" y="145" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#17324D"><tspan x="225" dy="0">DEMO</tspan></text><circle cx="225" cy="330" r="105" fill="#FFFFFF" stroke="#C6922A" stroke-width="6"/><text x="225" y="315" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" font-style="normal" fill="#17324D"><tspan x="225" dy="0">Can it work</tspan></text><text x="225" y="355" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="225" dy="0">once?</tspan></text><rect x="455" y="90" width="695" height="560" rx="18" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="802" y="145" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" font-style="normal" fill="#17324D"><tspan x="802" dy="0">PRODUCT</tspan></text><circle cx="580" cy="260" r="72" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="580" y="268" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="580" dy="0">Variation</tspan></text><circle cx="800" cy="225" r="72" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="800" y="233" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="800" dy="0">Truth</tspan></text><circle cx="1010" cy="280" r="72" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="1010" y="288" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="1010" dy="0">Repetition</tspan></text><circle cx="630" cy="460" r="72" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="630" y="468" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="630" dy="0">Safety</tspan></text><circle cx="850" cy="440" r="72" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="850" y="448" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="850" dy="0">Recovery</tspan></text><circle cx="1040" cy="500" r="72" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="1040" y="508" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="1040" dy="0">Learning</tspan></text><text x="802" y="610" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="802" dy="0">What happens across the distribution?</tspan></text>
</svg>
