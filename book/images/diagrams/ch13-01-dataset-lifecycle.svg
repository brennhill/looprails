<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Dataset lifecycle</title>
  <desc id="desc">A circular dataset lifecycle runs from production failure through candidate review, capability and regression suites, audit, then refresh or retirement.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <circle cx="600" cy="92" r="76" fill="#F8F0D8" stroke="#C6922A" stroke-width="4"/><text x="600" y="83" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="600" dy="0">Production</tspan><tspan x="600" dy="25.62">failure</tspan></text><circle cx="900" cy="190" r="76" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><text x="900" y="181" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="900" dy="0">Candidate</tspan><tspan x="900" dy="25.62">case</tspan></text><circle cx="1030" cy="410" r="76" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><text x="1030" y="401" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="1030" dy="0">Fairness +</tspan><tspan x="1030" dy="25.62">review</tspan></text><circle cx="800" cy="625" r="76" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><text x="800" y="616" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="800" dy="0">Capability</tspan><tspan x="800" dy="25.62">suite</tspan></text><circle cx="400" cy="625" r="76" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><text x="400" y="616" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="400" dy="0">Regression</tspan><tspan x="400" dy="25.62">suite</tspan></text><circle cx="170" cy="410" r="76" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><text x="170" y="401" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="170" dy="0">Staleness /</tspan><tspan x="170" dy="25.62">leakage audit</tspan></text><circle cx="300" cy="190" r="76" fill="#F5E9E1" stroke="#A85F32" stroke-width="4"/><text x="300" y="181" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" font-style="normal" fill="#17324D"><tspan x="300" dy="0">Refresh</tspan><tspan x="300" dy="25.62">or retire</tspan></text><line x1="677.9465176391079" y1="117.46252909544194" x2="816.3500786312012" y2="162.67435901952572" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="941.7158035943845" y1="260.5959753135739" x2="985.2318205328556" y2="334.23846551714024" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="970.096790975356" y1="465.99647800129765" x2="864.2863706605935" y2="564.9062187303148" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="718" y1="625" x2="488" y2="625" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="340.09679097535604" y1="569.0035219987024" x2="234.28637066059355" y2="470.0937812696853" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="211.71580359438457" y1="339.4040246864261" x2="255.23182053285558" y2="265.76153448285976" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="377.946517639108" y1="164.53747090455806" x2="516.3500786312012" y2="119.32564098047428" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="430" y="295" width="340" height="170" rx="16" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="600" y="361.7" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="650" font-style="normal" fill="#17324D"><tspan x="600" dy="0">MAINTAINED</tspan><tspan x="600" dy="36.6">EVIDENCE</tspan></text><text x="600" y="437" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="600" dy="0">owned · versioned · reviewed</tspan></text><rect x="65" y="635" width="220" height="75" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="175" y="679.15" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" font-style="normal" fill="#17324D"><tspan x="175" dy="0">invalid → fix history</tspan></text><rect x="490" y="675" width="220" height="60" rx="16" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="600" y="711.65" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" font-style="normal" fill="#17324D"><tspan x="600" dy="0">solved → regression</tspan></text><rect x="915" y="635" width="220" height="75" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="1025" y="679.15" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" font-style="normal" fill="#17324D"><tspan x="1025" dy="0">misaligned → retire</tspan></text>
</svg>
