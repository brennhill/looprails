<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">pass at k versus pass to the k</title>
  <desc id="desc">Three candidate attempts produce 98.44 percent pass at three, while three required sequential tasks produce 42.19 percent journey reliability, both from a 75 percent per-task rate.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <text x="600" y="55" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" font-style="normal" fill="#17324D"><tspan x="600" dy="0">Same per-task rate: 75%</tspan></text><text x="80" y="210" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="31" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="80" dy="0">pass@3</tspan></text><rect x="300" y="130" width="140" height="115" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="370" y="195.9" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="650" font-style="normal" fill="#17324D"><tspan x="370" dy="0">try</tspan></text><rect x="485" y="130" width="140" height="115" rx="16" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="555" y="195.9" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="650" font-style="normal" fill="#17324D"><tspan x="555" dy="0">PASS</tspan></text><rect x="670" y="130" width="140" height="115" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="740" y="195.9" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="650" font-style="normal" fill="#17324D"><tspan x="740" dy="0">try</tspan></text><line x1="810" y1="187" x2="925" y2="187" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="945" y="127" width="180" height="120" rx="16" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="1035" y="187" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="650" font-style="normal" fill="#17324D"><tspan x="1035" dy="0">98.44%</tspan></text><text x="1035" y="219" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="1035" dy="0">one must pass</tspan></text><text x="80" y="485" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="31" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="80" dy="0">pass³</tspan></text><rect x="300" y="405" width="140" height="115" rx="16" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="370" y="470.9" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="650" font-style="normal" fill="#17324D"><tspan x="370" dy="0">PASS</tspan></text><rect x="485" y="405" width="140" height="115" rx="16" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="555" y="470.9" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="650" font-style="normal" fill="#17324D"><tspan x="555" dy="0">PASS</tspan></text><rect x="670" y="405" width="140" height="115" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="740" y="470.9" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="650" font-style="normal" fill="#17324D"><tspan x="740" dy="0">FAIL</tspan></text><line x1="810" y1="462" x2="925" y2="462" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="945" y="402" width="180" height="120" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="1035" y="462" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="650" font-style="normal" fill="#17324D"><tspan x="1035" dy="0">42.19%</tspan></text><text x="1035" y="494" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="1035" dy="0">all must pass</tspan></text><text x="600" y="650" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="600" dy="0">Selection rewards one success · journeys expose every failure</tspan></text>
</svg>
