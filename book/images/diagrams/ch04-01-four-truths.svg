<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Four kinds of truth</title>
  <desc id="desc">A fluent agent output points to four external evidence workbenches: repository tests, database state, expert criteria, and cited source passages.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <rect x="445" y="285" width="310" height="180" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="600" y="323" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" font-style="normal" fill="#C6922A"><tspan x="600" dy="0">“ … ”</tspan></text><text x="600" y="363" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="650" font-style="normal" fill="#17324D"><tspan x="600" dy="0">Fluent agent output</tspan></text><text x="600" y="437" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="600" dy="0">claim, patch, promise, report</tspan></text><rect x="60" y="60" width="330" height="150" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="225" y="98" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" font-style="normal" fill="#C6922A"><tspan x="225" dy="0">⌁</tspan></text><text x="225" y="138" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" font-weight="650" font-style="normal" fill="#17324D"><tspan x="225" dy="0">SWE-bench</tspan></text><text x="225" y="182" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="225" dy="0">patch → tests / repo state</tspan></text><rect x="810" y="60" width="330" height="150" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="975" y="98" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" font-style="normal" fill="#C6922A"><tspan x="975" dy="0">▤</tspan></text><text x="975" y="138" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" font-weight="650" font-style="normal" fill="#17324D"><tspan x="975" dy="0">τ-bench</tspan></text><text x="975" y="182" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="975" dy="0">promise → database / actions</tspan></text><rect x="60" y="540" width="330" height="150" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="225" y="578" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" font-style="normal" fill="#C6922A"><tspan x="225" dy="0">✚</tspan></text><text x="225" y="618" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" font-weight="650" font-style="normal" fill="#17324D"><tspan x="225" dy="0">HealthBench</tspan></text><text x="225" y="662" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="225" dy="0">response → expert criteria</tspan></text><rect x="810" y="540" width="330" height="150" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="975" y="578" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" font-style="normal" fill="#C6922A"><tspan x="975" dy="0">◇</tspan></text><text x="975" y="618" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" font-weight="650" font-style="normal" fill="#17324D"><tspan x="975" dy="0">DeepResearch</tspan></text><text x="975" y="662" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" font-style="normal" fill="#6B7280"><tspan x="975" dy="0">claim → source passage</tspan></text><line x1="445" y1="330" x2="390" y2="180" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="755" y1="330" x2="810" y2="180" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="445" y1="420" x2="390" y2="615" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="755" y1="420" x2="810" y2="615" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><text x="600" y="505" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="750" font-style="normal" fill="#A85F32"><tspan x="600" dy="0">Truth lives outside the prose</tspan></text>
</svg>
