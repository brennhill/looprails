nchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="650" font-style="normal" fill="#17324D"><tspan x="912.5" dy="0">Retry</tspan></text><rect x="1015" y="185" width="135" height="80" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="1082.5" y="232.35" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="650" font-style="normal" fill="#17324D"><tspan x="1082.5" dy="0">Change</tspan></text><text x="570" y="335" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="570" dy="0">state not re-read</tspan></text><path d="M 740 352 L 758 370 L 740 388 L 722 370 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="740" y="415" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="740" dy="0">first change</tspan></text><path d="M 1080 352 L 1098 370 L 1080 388 L 1062 370 Z" fill="#C6922A" stroke="#252A30" stroke-width="2"/><text x="1080" y="415" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="1080" dy="0">duplicate</tspan></text><rect x="500" y="445" width="160" height="82" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="580" y="480.54" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="650" font-style="normal" fill="#17324D"><tspan x="580" dy="0">FIRST</tspan><tspan x="580" dy="25.62">DEPARTURE</tspan></text><line x1="580" y1="445" x2="570" y2="285" stroke="#A85F32" stroke-width="5" marker-end="url(#arrow-copper)"/><rect x="980" y="445" width="160" height="82" rx="16" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="1060" y="480.54" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="650" font-style="normal" fill="#17324D"><tspan x="1060" dy="0">VISIBLE</tspan><tspan x="1060" dy="25.62">FAILURE</tspan></text><line x1="1060" y1="445" x2="1080" y2="285" stroke="#A85F32" stroke-width="5" marker-end="url(#arrow-copper)"/><rect x="105" y="625" width="185" height="66" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="197.5" y="665" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" font-style="normal" fill="#17324D"><tspan x="197.5" dy="0">Contract</tspan></text><rect x="310" y="625" width="185" height="66" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="402.5" y="665" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" font-style="normal" fill="#17324D"><tspan x="402.5" dy="0">Outcome</tspan></text><rect x="515" y="625" width="185" height="66" rx="16" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="607.5" y="665" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" font-style="normal" fill="#17324D"><tspan x="607.5" dy="0">First departure</tspan></text><rect x="720" y="625" width="185" height="66" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="812.5" y="665" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" font-style="normal" fill="#17324D"><tspan x="812.5" dy="0">Recovery</tspan></text><rect x="925" y="625" width="185" height="66" rx="16" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="1017.5" y="665" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" font-style="normal" fill="#17324D"><tspan x="1017.5" dy="0">Grader</tspan></text>
