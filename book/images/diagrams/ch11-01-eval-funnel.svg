<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation funnel</title>
  <desc id="desc">Five narrowing evaluation gates move from local smoke checks through PR, nightly, held-out audit, and production rollout, which loops back to discovery.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <rect x="60" y="150" width="190" height="420" rx="6" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="155" y="205" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="155" dy="0">Local smoke</tspan></text><text x="155" y="250" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="155" dy="0">seconds</tspan><tspan x="155" dy="21.96">small + blocking</tspan></text><line x1="250" y1="360" x2="292" y2="360" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="250" y="190" width="190" height="340" rx="6" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="345" y="245" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="345" dy="0">PR regression</tspan></text><text x="345" y="290" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="345" dy="0">minutes</tspan><tspan x="345" dy="21.96">changed areas</tspan></text><line x1="440" y1="360" x2="482" y2="360" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="440" y="230" width="190" height="260" rx="6" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="535" y="285" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="535" dy="0">Nightly</tspan></text><text x="535" y="330" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="535" dy="0">hours</tspan><tspan x="535" dy="21.96">capability suite</tspan></text><line x1="630" y1="360" x2="672" y2="360" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="630" y="270" width="190" height="180" rx="6" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="725" y="325" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="725" dy="0">Held-out audit</tspan></text><text x="725" y="370" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="725" dy="0">scheduled</tspan><tspan x="725" dy="21.96">release evidence</tspan></text><line x1="820" y1="360" x2="862" y2="360" stroke="#17324D" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="820" y="310" width="190" height="100" rx="6" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="915" y="365" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#17324D"><tspan x="915" dy="0">Production</tspan></text><text x="915" y="410" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="915" dy="0">guarded</tspan><tspan x="915" dy="21.96">real outcomes</tspan></text><path d="M 915 435 C 900 650, 360 690, 150 600" fill="none" stroke="#A85F32" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-copper)"/><text x="565" y="705" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="565" dy="0">production evidence starts task discovery</tspan></text><text x="1065" y="195" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="1065" dy="0">fewer</tspan><tspan x="1065" dy="24.4">candidates</tspan></text><text x="1065" y="355" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#6B7280"><tspan x="1065" dy="0">stronger</tspan><tspan x="1065" dy="24.4">evidence</tspan></text>
</svg>
