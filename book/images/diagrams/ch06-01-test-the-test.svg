<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Four attacks on an executable grader</title>
  <desc id="desc">Four quadrants show narrow passing, overconstraint, side-effect escape, and environment tricks as attacks on executable graders.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <rect x="50" y="70" width="530" height="275" rx="18" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="315" y="125" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" font-style="normal" fill="#A85F32"><tspan x="315" dy="0">NARROW PASS</tspan></text><circle cx="180" cy="230" r="55" fill="#FFFFFF" stroke="#A85F32" stroke-width="3"/><text x="180" y="241" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="180" dy="0">✓?</tspan></text><text x="380" y="220" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#17324D"><tspan x="380" dy="0">Can a wrong solution</tspan><tspan x="380" dy="29.28">satisfy this test?</tspan></text><rect x="620" y="70" width="530" height="275" rx="18" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="885" y="125" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" font-style="normal" fill="#17324D"><tspan x="885" dy="0">OVERCONSTRAINT</tspan></text><circle cx="750" cy="230" r="55" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="750" y="241" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" font-style="normal" fill="#17324D"><tspan x="750" dy="0">✕?</tspan></text><text x="950" y="220" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#17324D"><tspan x="950" dy="0">Does a valid alternative</tspan><tspan x="950" dy="29.28">fail?</tspan></text><rect x="50" y="405" width="530" height="275" rx="18" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="315" y="460" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" font-style="normal" fill="#A85F32"><tspan x="315" dy="0">SIDE-EFFECT ESCAPE</tspan></text><circle cx="180" cy="565" r="55" fill="#FFFFFF" stroke="#A85F32" stroke-width="3"/><text x="180" y="576" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="180" dy="0">↗</tspan></text><text x="380" y="555" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#17324D"><tspan x="380" dy="0">What changed outside</tspan><tspan x="380" dy="29.28">the assertion?</tspan></text><rect x="620" y="405" width="530" height="275" rx="18" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="885" y="460" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" font-style="normal" fill="#17324D"><tspan x="885" dy="0">ENVIRONMENT TRICK</tspan></text><circle cx="750" cy="565" r="55" fill="#FFFFFF" stroke="#17324D" stroke-width="3"/><text x="750" y="576" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" font-style="normal" fill="#17324D"><tspan x="750" dy="0">⚙</tspan></text><text x="950" y="555" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#17324D"><tspan x="950" dy="0">Did setup make the</tspan><tspan x="950" dy="29.28">answer accidental?</tspan></text>
</svg>
