<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">The grader ladder</title>
  <desc id="desc">Six ascending grader steps from an environment oracle to expert judgment, with increasing interpretive scope and cost.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A85F32"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3" opacity="0.35"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FCFAF6"/>
  <rect x="210" y="610" width="170" height="82" rx="8" fill="#F8F0D8" stroke="#17324D" stroke-width="3"/><text x="295" y="644" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="295" dy="0">Environment oracle</tspan></text><rect x="345" y="528" width="170" height="82" rx="8" fill="#F8F0D8" stroke="#17324D" stroke-width="3"/><text x="430" y="562" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="430" dy="0">Executable test</tspan></text><rect x="480" y="446" width="170" height="82" rx="8" fill="#F8F0D8" stroke="#17324D" stroke-width="3"/><text x="565" y="480" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="565" dy="0">Structured evidence</tspan></text><rect x="615" y="364" width="170" height="82" rx="8" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="700" y="398" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="700" dy="0">Deterministic rule</tspan></text><rect x="750" y="282" width="170" height="82" rx="8" fill="#E9EEF3" stroke="#17324D" stroke-width="3"/><text x="835" y="316" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="835" dy="0">Model judge</tspan></text><rect x="885" y="200" width="170" height="82" rx="8" fill="#F5E9E1" stroke="#A85F32" stroke-width="3"/><text x="970" y="234" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="970" dy="0">Expert judgment</tspan></text><path d="M 120 650 L 120 150" fill="none" stroke="#17324D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><text x="86" y="635" text-anchor="end" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="86" dy="0">direct</tspan></text><text x="86" y="190" text-anchor="end" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#17324D"><tspan x="86" dy="0">flexible</tspan></text><path d="M 1080 650 L 1080 150" fill="none" stroke="#A85F32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-copper)"/><text x="1115" y="635" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="1115" dy="0">cheap</tspan></text><text x="1115" y="190" text-anchor="start" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#A85F32"><tspan x="1115" dy="0">costly</tspan></text><rect x="440" y="82" width="320" height="72" rx="16" fill="#F8F0D8" stroke="#C6922A" stroke-width="3"/><text x="600" y="126.05" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="650" font-style="normal" fill="#17324D"><tspan x="600" dy="0">Stop when evidence is strong enough</tspan></text><path d="M 600 156 C 660 210, 710 230, 760 275" fill="none" stroke="#C6922A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-navy)"/>
</svg>
